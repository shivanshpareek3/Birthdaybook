<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suhani's 20th Birthday</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;700&display=swap');
    
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      font-family: 'Nunito', sans-serif;
      text-align: center;
    }

    .container {
      background: white;
      padding: 3rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 90%;
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      color: #333;
      margin-bottom: 0.5rem;
      font-size: 2.5rem;
    }

    p {
      color: #666;
      margin-bottom: 2rem;
      font-size: 1.2rem;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    a.btn {
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 50px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.2rem;
      color: white;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-book {
      background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
      color: #333 !important;
      box-shadow: 0 4px 15px rgba(255, 154, 158, 0.4);
    }

    .btn-film {
      background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
      box-shadow: 0 4px 15px rgba(161, 140, 209, 0.4);
    }
    
    a.btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Suhani's 20th Birthday 🎂</h1>
    <p>A collection of memories, love, and annoyances.</p>
    
    <div class="buttons">
      <a href="suhani-birthday/index.html" class="btn btn-book">📖 Read the Birthday Book</a>
      <a href="suhani-birthday/film/index.html" class="btn btn-film">🎬 Watch the Birthday Film</a>
    </div>
  </div>

</body>
</html>
